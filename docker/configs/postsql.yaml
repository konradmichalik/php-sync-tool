# post_sql scenario, driven from inside www2 (RECEIVER + a post-import SQL hook):
#   after the import, the target runs the configured post_sql statements.
#
# Run: docker compose exec www2 php /app/bin/sync-tool \
#        -f /app/docker/configs/postsql.yaml -y
use_sshpass: true
ssh_strict_host_key_checking: false

origin:
  host: www1
  user: root
  password: root
  port: 22
  dump_dir: /tmp/
  db:
    name: db
    host: db1
    user: db
    password: db
    port: 3306

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
  post_sql:
    - 'INSERT INTO person (name) VALUES ("Dave")'
