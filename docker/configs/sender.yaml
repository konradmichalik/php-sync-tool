# SENDER scenario, driven from inside www1:
#   origin = www1 itself (local), its database lives on db1
#   target = www2 (remote over SSH), its database lives on db2
#
# Run: docker compose exec www1 php /app/bin/sync-tool \
#        -f /app/docker/configs/sender.yaml -y
use_sshpass: true
ssh_strict_host_key_checking: false

origin:
  dump_dir: /tmp/
  db:
    name: db
    host: db1
    user: db
    password: db
    port: 3306

target:
  host: www2
  user: root
  password: root
  port: 22
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
