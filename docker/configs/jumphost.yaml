# Jump-host scenario, driven from inside www2:
#   origin = www3, which lives on the isolated `internal` network and is NOT
#   directly reachable from www2 — the connection is routed through the `proxy`
#   bastion (system ssh -J). Key auth uses the keypair baked into the image.
#   target = www2 itself (local), db2.
#
# Run: docker compose exec www2 php /app/bin/sync-tool \
#        -f /app/docker/configs/jumphost.yaml -y
ssh_strict_host_key_checking: false

origin:
  host: www3
  user: root
  port: 22
  dump_dir: /tmp/
  jump_host:
    host: proxy
    user: root
  db:
    name: db
    host: db3
    user: db
    password: db
    port: 3306

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
