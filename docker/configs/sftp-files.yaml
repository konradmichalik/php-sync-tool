# File synchronization scenario over the SFTP fallback (RECEIVER + files,
# --no-rsync --with-files), driven from inside www2: the database syncs
# db1 → db2 and a directory (with a nested file and an excluded pattern) is
# pulled recursively from www1 via phpseclib SFTP instead of rsync.
#
# Run: docker compose exec www2 php /app/bin/sync-tool \
#        -f /app/docker/configs/sftp-files.yaml --no-rsync --with-files -y
use_sshpass: true
ssh_strict_host_key_checking: false

origin:
  host: www1
  user: root
  password: root
  port: 22
  dump_dir: /tmp/
  db:
    name: db
    host: db1
    user: db
    password: db
    port: 3306

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306

files:
  - origin: /app/docker/fixtures/syncdir
    target: /tmp/synced-dir
    exclude:
      - '*.log'
