# TYPO3 credential auto-detection (LocalConfiguration.php via php-include), driven from www2.
use_sshpass: true
ssh_strict_host_key_checking: false
type: TYPO3

origin:
  host: www1
  user: root
  password: root
  port: 22
  path: /app/docker/fixtures/typo3/LocalConfiguration.php
  dump_dir: /tmp/

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
