# truncate_tables scenario, driven from www2 (RECEIVER):
#   the target's `legacy` table (which is NOT part of the origin dump) is
#   emptied before the import, while `person` is imported normally.
#
# Run: docker compose exec www2 php /app/bin/sync-tool \
#        -f /app/docker/configs/truncate.yaml -y
use_sshpass: true
ssh_strict_host_key_checking: false

truncate_tables:
  - legacy

origin:
  host: www1
  user: root
  password: root
  port: 22
  dump_dir: /tmp/
  db:
    name: db
    host: db1
    user: db
    password: db
    port: 3306

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
