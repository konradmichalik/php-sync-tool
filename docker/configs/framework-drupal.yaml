# Drupal credential auto-detection (settings.php), driven from www2.
use_sshpass: true
ssh_strict_host_key_checking: false
type: Drupal

origin:
  host: www1
  user: root
  password: root
  port: 22
  path: /app/docker/fixtures/drupal/settings.php
  dump_dir: /tmp/

target:
  dump_dir: /tmp/
  db:
    name: db
    host: db2
    user: db
    password: db
    port: 3306
